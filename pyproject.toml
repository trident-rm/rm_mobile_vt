[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vt13-video"
version = "0.1.0"
description = "Read-only VT13 USB HEVC receiver with real-time BGR frame output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyusb>=1.2.1",
    "av>=10.0.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "PyYAML>=6.0",
]

[project.scripts]
vt13-video = "vt13_video.cli:main"

[tool.setuptools.packages.find]
include = ["vt13_video*"]
